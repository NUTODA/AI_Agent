[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-agent-foundation"
version = "0.1.0"
description = "Foundation for an LLM-driven browser agent with typed runtime contracts and safety-first automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0,<2",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
browser-agent = "browser_agent.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_agent = ["demos/pages/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: launches a local Playwright browser when available",
]
